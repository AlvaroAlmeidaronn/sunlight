# Where public builds live. scripts/package.sh writes the Sparkle keys into Info.plist from here, and
# scripts/release.sh uses the rest. Sparkle stays off in builds where either key is empty.

# The public repo whose GitHub Releases hold the zip, the DMG and appcast.xml.
RELEASES_REPO="spacefarm-digital/sunlight-releases"
# Sparkle's feed. GitHub serves the latest release's appcast.xml at this address.
SPARKLE_FEED_URL="https://github.com/spacefarm-digital/sunlight-releases/releases/latest/download/appcast.xml"
# The public half of the EdDSA key that signs updates; `make sparkle-keys` makes the pair and prints it.
# The private half stays in the login keychain of the Mac that releases.
SPARKLE_PUBLIC_KEY="v+fLqTdj/SadP3NPHwXlIMrDch28yqi8b6IdlGujNxI="
# The tap repo the cask goes in (`brew install spacefarm-digital/tap/sunlight`).
TAP_REPO="spacefarm-digital/homebrew-tap"
